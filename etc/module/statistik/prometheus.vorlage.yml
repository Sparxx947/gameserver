# Vorlage. modul-verwalten schreibt daraus /opt/module/statistik/prometheus.yml
# und laesst die Bloecke weg, deren Schalter aus ist - dasselbe Muster wie die
# Katalogbloecke in /etc/borg-ausschluss.txt.
#
# Warum ueberhaupt weglassen und nicht einfach alles eintragen: Ein Ziel, das
# nicht laeuft, steht in Prometheus dauerhaft als "down". Wer sich daran
# gewoehnt, sieht das echte "down" nicht mehr.
# *Why leave blocks out instead of listing everything: a target that is not
#  running shows as permanently down, and one gets used to it.*
global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: maschine
    static_configs:
      # Alles laeuft im Netz der Maschine und lauscht auf 127.0.0.1 (#275).
      - targets: ["127.0.0.1:19100"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:19090"]

# >>> schalter:cadvisor
  - job_name: container
    static_configs:
      - targets: ["127.0.0.1:19080"]
# <<< schalter:cadvisor

# >>> schalter:probe
  - job_name: erreichbarkeit
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: []
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:19115

  # Die Statusseite ueber HTTPS - nicht wegen der Seite, sondern wegen des
  # Zertifikats: Der Abruf liefert dessen Ablaufdatum. Geprueft wird /status,
  # weil die Seite oeffentlich ist; jede andere Adresse antwortete mit 401 und
  # der Abruf gaelte als Fehlschlag.
  # *The status page over HTTPS - for the certificate's expiry date, not the
  #  page. /status because it is public; anything else answers 401 and the probe
  #  would count as failed.*
  - job_name: zertifikat
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://@@PANEL_DOMAIN@@/status"]
        labels: {ziel: Panel}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:19115
# <<< schalter:probe
