# Von install/10-basis.sh eingesetzt. Die Werte stehen in konfiguration.env
# (SSH_PASSWORT_AUTH, SSH_ROOT_LOGIN) - hier von Hand zu aendern hilft nur bis
# zur naechsten Einrichtung und meldet werkzeuge/abgleich.sh als Abweichung.
#
# *Installed by stage 10; the values come from konfiguration.env. Editing this
#  file by hand lasts until the next run and shows up as drift.*

# PasswordAuthentication und KbdInteractiveAuthentication tragen denselben Wert
# und stammen aus EINER Variablen. Getrennt gefuehrt sind sie die bekannteste
# Falle dieser Datei: Wer nur PasswordAuthentication auf "no" stellt und
# KbdInteractiveAuthentication stehen laesst, hat die Passwortanmeldung nicht
# abgeschaltet - sie laeuft dann ueber PAM weiter, waehrend die Konfiguration
# aussieht, als waere zu. Zwei Schalter fuer eine Frage koennen sich
# widersprechen, einer nicht (wie BORG_REPO=aus in install/lib.sh).
#
# *Both carry the same value from one variable. Kept apart they are this file's
#  best-known trap: setting only PasswordAuthentication to "no" leaves password
#  login working through PAM while the config looks closed.*
PasswordAuthentication @@SSH_PASSWORT_AUTH@@
KbdInteractiveAuthentication @@SSH_PASSWORT_AUTH@@

PermitRootLogin @@SSH_ROOT_LOGIN@@

# Nicht konfigurierbar: auf einem Server ohne Bildschirm gibt es nichts
# weiterzuleiten, und der Schalter oeffnet einen Weg zurueck auf den Client.
# *Not configurable: nothing to forward on a headless server, and the switch
#  opens a path back to the client.*
X11Forwarding no
