# FOUNDRY-Server, angelegt 2026-09-06.
# Query-Port bewusst auf 27016 statt 27015: Palworld belegt 27015 schon. Die
# Ports muessen sich unterscheiden, sonst startet nur einer von beiden.
services:
  foundry:
    image: luxusburg/docker-foundry:latest
    container_name: foundry
    hostname: foundry
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 6g
    memswap_limit: 6g
    ports:
      - "3724:3724/udp"
      - "27016:27016/udp"
    volumes:
      - /srv/games/foundry/server:/home/foundry/server_files:rw
      - /srv/games/foundry/data:/home/foundry/persistent_data:rw
    environment:
      SERVER_NAME: "@@WELT_NAME@@"
      SERVER_PWD: "@@PASSWORT@@"
      SERVER_PORT: "3724"
      SERVER_QUERY_PORT: "27016"
      SERVER_MAX_PLAYERS: "4"
      # AUS, und das ist ein Befund, kein Geschmack: Mit "true" pausiert das
      # Spiel, sobald niemand drauf ist - und ein pausierter Server laesst sein
      # Autosave-Intervall nicht laufen. FOUNDRY hat deshalb vom 06.09. bis zum
      # 10.09. NIE einen Spielstand geschrieben, und die Sicherung fing jedes
      # Mal vier leere Verzeichnisse ein und meldete Erfolg (#138).
      #
      # Mit "false" schreibt er fuenf rotierende Autosaves im Takt von
      # autosave_interval=300. ACHTUNG beim Nachpruefen: Der ERSTE kommt etwa
      # elf Minuten nach dem Start (Laden der Welt plus erstes Intervall). Eine
      # Pruefung nach sieben Minuten sieht nichts und fuehrt zu genau dem
      # Fehlschluss, der hier einmal gezogen wurde. Und: Beim Herunterfahren
      # speichert FOUNDRY NICHT - ein Absturz verliert bis zu fuenf Minuten.
      # *First autosave arrives ~11 minutes after start; a check at seven
      #  minutes sees nothing, which is exactly the wrong conclusion drawn here
      #  once. FOUNDRY does not save on shutdown either.*
      #
      # Den Leerlauf uebernimmt seit #118 platzwart-schlaf. Der kann es besser:
      # Er haelt den Container wirklich an (spart Speicher statt nur CPU) und
      # weckt ihn beim Beitritt ueber systemd wieder.
      #
      # *Off, and that is a finding rather than taste: paused, the game does not
      #  run its autosave interval, so FOUNDRY never wrote a save between 06.09.
      #  and 10.09. while the backup captured four empty directories and
      #  reported success. Idling is platzwart-schlaf's job since #118, and it
      #  does it better - it actually stops the container and wakes it on join.*
      PAUSE_SERVER_WHEN_EMPTY: "false"
