# StarRupture-Server, angelegt 2026-09-06. Vorlage: steam-dedicated-server/starrupture-docker
#
# Der Server ist ein WINDOWS-Binary und laeuft hier unter Wine + Xvfb — derselbe
# Weg wie beim Enshrouded-Container. Kein Herstellersupport dafuer.
#
# Ports weichen bewusst vom Standard ab: 7777 gehoert Satisfactory, 27015 Palworld.
#   Spiel  7779/udp+tcp   (statt 7777)
#   Query  27017/udp      (statt 27015)
#
# Volume ist ein BIND-MOUNT, kein Docker-Volume: nur so kommt die Borg-Sicherung
# an die Spielstaende.
#
# Erstinstallation (einmalig, laedt die Serverdateien):
#   docker compose --profile maintenance run --rm install
# Danach:
#   docker compose up -d server
x-image: &image
  image: starrupture-local:latest

x-common: &common
  <<: *image
  # Neustartschleife vermeiden: StarRupture lief am 2026-09-06 32-mal in sein
  # Speicherlimit (anon-rss 9,85 GB bei 10 GB Grenze) und wurde von
  # "unless-stopped" jedes Mal sofort neu gestartet — 145 % CPU ohne Nutzen.
  # "on-failure:3" versucht es dreimal und gibt dann Ruhe.
  restart: on-failure:3
  stop_grace_period: 60s
  init: false
  security_opt:
    - seccomp:unconfined
  ulimits:
    nofile: {soft: 1048576, hard: 1048576}
    nproc: 65535
  volumes:
    - /srv/games/starrupture:/mnt/steam
  tmpfs:
    - /tmp:size=512m
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

x-env: &env
  SERVER_NAME:        "@@WELT_NAME@@"
  SERVER_PORT:        "7779"
  SERVER_QUERY_PORT:  "27017"
  USE_DSSETTINGS:     "true"
  SESSION_NAME:       "@@WELT_NAME@@"
  SAVE_GAME_INTERVAL: "300"
  START_NEW_GAME:     "true"   # ERSTSTART: Welt anlegen. Danach zurueck auf false.
  LOAD_SAVED_GAME:    "false"  # ERSTSTART: es gibt noch keinen Spielstand.
  SAVE_GAME_NAME:     "AutoSave0.sav"
  STEAM_USER:         "anonymous"

services:
  install:
    <<: *common
    profiles: ["maintenance"]
    restart: "no"
    command: ["install"]
    environment: *env
  update:
    <<: *common
    profiles: ["maintenance"]
    restart: "no"
    command: ["update"]
    environment: *env
  server:
    <<: *common
    container_name: starrupture
    command: ["run"]
    environment: *env
    ports:
      - "7779:7779/udp"
      - "7779:7779/tcp"
      - "27017:27017/udp"
    mem_limit: 16g
    memswap_limit: 18g
